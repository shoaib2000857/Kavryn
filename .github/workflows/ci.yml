name: CI

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Unit, types, lint, and schemas
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.16"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install locked development dependencies
        run: uv sync --locked --extra dev

      - name: Run unit tests
        run: uv run pytest -q

      - name: Check formatting and lint
        run: |
          uv run ruff format --check .
          uv run ruff check .

      - name: Type-check
        run: uv run mypy

      - name: Check exported JSON Schemas
        run: uv run python scripts/export_schemas.py --check

      - name: Build and inspect downloadable SDK distributions
        run: |
          uv build --out-dir dist
          uv run python scripts/check_release.py dist

      - name: Smoke-test installed wheel outside the checkout
        shell: bash
        run: |
          KAVRYN_SMOKE_DIR="$(mktemp -d)"
          uv venv --python 3.12 "$KAVRYN_SMOKE_DIR/venv"
          uv pip install --python "$KAVRYN_SMOKE_DIR/venv/bin/python" dist/*.whl
          cd "$KAVRYN_SMOKE_DIR"
          "$KAVRYN_SMOKE_DIR/venv/bin/python" -I -c 'import kavryn; assert kavryn.verify_execution_receipt(kavryn.run_transaction_demo())'
          "$KAVRYN_SMOKE_DIR/venv/bin/kavryn" --version
          "$KAVRYN_SMOKE_DIR/venv/bin/kavryn" doctor
          "$KAVRYN_SMOKE_DIR/venv/bin/kavryn" demo --fail-verification

      - name: Upload checked SDK downloads
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: kavryn-sdk-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 14

  docker-integration:
    name: Synthetic Docker integration
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.16"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install locked development dependencies
        run: uv sync --locked --extra dev

      - name: Confirm ephemeral runner Docker is available
        run: docker info

      - name: Run authorized local-range integrations
        run: uv run pytest tests/integration -q -m integration
