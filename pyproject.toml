[project]
name = "aegis-defender"
version = "0.1.0"
description = "Control-first autonomous cyber defense research project: domain schemas and control-plane foundations."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "UNLICENSED" }
dependencies = ["pydantic>=2.9,<3"]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "ruff>=0.12,<1",
    "mypy>=1.17,<2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aegis"]

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
addopts = "-ra"
markers = [
    "integration: requires Docker and the pinned analysis-worker image; not run by default (see tests/integration/README.md)",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["aegis"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
files = ["src", "tests", "scripts"]
explicit_package_bases = true
plugins = ["pydantic.mypy"]
strict = true
warn_unused_ignores = true
disallow_any_generics = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
