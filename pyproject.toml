[project]
name = "kavryn"
version = "0.1.0"
description = "Transactional execution for AI agents: typed authority, independent verification, and evidence-linked receipts."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Shoaib Sadiq Salehmohamed" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Security",
    "Typing :: Typed",
]
dependencies = ["pydantic>=2.9,<3"]

[project.scripts]
kavryn = "aegis.cli:main"
aegis = "aegis.cli:main"

[project.urls]
Repository = "https://github.com/shoaib2000857/Kavryn"
Issues = "https://github.com/shoaib2000857/Kavryn/issues"
Documentation = "https://github.com/shoaib2000857/Kavryn/blob/main/docs/SDK_QUICKSTART.md"

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "ruff>=0.12,<1",
    "mypy>=1.17,<2",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aegis", "src/kavryn"]

[tool.hatch.build.targets.sdist]
include = [
    "/src", "/tests/unit", "/examples", "/pyproject.toml",
    "/README.md", "/SECURITY.md", "/CONTRIBUTING.md", "/CITATION.cff",
    "/LICENSE", "/NOTICE", "/docs/SDK_QUICKSTART.md",
    "/scripts", "/schemas",
]

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
addopts = "-ra"
markers = [
    "integration: requires Docker and the pinned analysis-worker image; not run by default (see tests/integration/README.md)",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["aegis", "kavryn"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
files = ["src", "tests", "scripts"]
explicit_package_bases = true
plugins = ["pydantic.mypy"]
strict = true
warn_unused_ignores = true
disallow_any_generics = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
