# Pinned, offline Semgrep ruleset for the analysis worker (no registry
# fetch — the worker runs with --network none, so rules must be baked
# into the image, per docs/TOOLS_AND_SANDBOXES.md's tool-descriptor
# convention of a "ruleset_ref: immutable-artifact").
rules:
  - id: python-flask-path-traversal
    languages: [python]
    severity: ERROR
    message: >-
      Untrusted Flask request input flows into a filesystem path
      operation without validation or canonicalization (CWE-22, path
      traversal).
    mode: taint
    pattern-sources:
      - pattern: request.args.get(...)
      - pattern: request.args[...]
      - pattern: request.values.get(...)
      - pattern: request.form.get(...)
    pattern-sinks:
      - pattern: os.path.join(...)
      - pattern: open(...)
    metadata:
      cwe: "CWE-22"
      references:
        - https://cwe.mitre.org/data/definitions/22.html
  - id: python-flask-object-authorization
    languages: [python]
    severity: ERROR
    message: >-
      A document route returns an object without a local owner check against the
      authenticated principal (CWE-862, missing authorization).
    patterns:
      - pattern-inside: |
          @app.get("/documents/<document_id>")
          def $HANDLER(...):
            ...
      - pattern: return jsonify(...)
      - pattern-not-inside: |
          if document["owner"] != g.principal:
            ...
    metadata:
      cwe: "CWE-862"
